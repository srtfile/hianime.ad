name: Scrape HiAnime URLs

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      start_page:
        description: 'Start page (e.g. 1)'
        required: false
        default: '1'
        type: string
      end_page:
        description: 'End page (e.g. 259)'
        required: false
        default: '259'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper (scheduled - first 5 pages)
        if: github.event_name == 'schedule'
        run: |
          echo "Scheduled run: scraping pages 1 to 5"
          python scrape_anime_urls_github.py --start 1 --end 5 --delay 0.5

      - name: Run scraper (scheduled - last page)
        if: github.event_name == 'schedule'
        run: |
          echo "Scheduled run: scraping last pages 262-263"
          python scrape_anime_urls_github.py --start 262 --end 263 --delay 0.5

      - name: Run scraper (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          START=${{ github.event.inputs.start_page }}
          END=${{ github.event.inputs.end_page }}
          echo "Manual run: scraping pages $START to $END"
          python scrape_anime_urls_github.py --start $START --end $END --delay 0.5

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          touch data/error.txt
          git add data/
          if [ "${{ github.event_name }}" == "schedule" ]; then
            git commit -m "Update anime URLs (scheduled: pages 1-5 + 262-263) - $(date +'%Y-%m-%d %H:%M:%S')"
          else
            git commit -m "Update anime URLs (manual: pages ${{ github.event.inputs.start_page }}-${{ github.event.inputs.end_page }}) - $(date +'%Y-%m-%d %H:%M:%S')"
          fi
          git push origin HEAD:${{ github.ref }}
